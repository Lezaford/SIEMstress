[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "siemstress"
version = "0.1.0"
description = "A lightweight SIEM for homelabs"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "SIEMstress contributors", email = "Lezaford@users.noreply.github.com" }]
requires-python = ">=3.12"
dependencies = []
keywords = ["siem", "security", "syslog", "journald", "homelab", "intrusion-detection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]
tui = ["textual>=1.0"]

[project.scripts]
siemstress = "siemstress.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "PySide6>=6.7", "textual>=1.0", "Hershey-Fonts>=2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
